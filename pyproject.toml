[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-utopia"
version = "0.1.0"
description = "Local autonomous agent world and private research observer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3", "sympy>=1.13,<2", "pydantic>=2.10,<3",
  "pyarrow>=20,<24", "textual>=1.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]
training = ["torch>=2.6", "transformers>=4.50,<6", "peft>=0.15,<1", "datasets>=3,<5"]
training-4bit = ["bitsandbytes>=0.50.2,<0.51"]

[project.scripts]
utopia = "utopia.cli:main"
utopia-desktop = "utopia.desktop:main"
utopia-control = "utopia.control:main"
utopia-maintenance = "utopia.maintenance:main"

[tool.setuptools.packages.find]
include = ["utopia*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires real Docker and Ollama; enable with UTOPIA_INTEGRATION=1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
