name: Deploy documentation to Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish docs to GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: docs/
          preprocess: true
          disable-empty-commits: true
